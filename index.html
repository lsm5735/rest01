<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이력서 - [이름]</title>
  <!-- ===== Favicon ===== -->
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png" />

  <!-- ===== Open Graph (카카오톡·SNS 공유) ===== -->
  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://lsm5735.github.io/rest01/" />
  <meta property="og:title"       content="MIA LEE — Curator / Art Director" />
  <meta property="og:description" content="전시 기획·아트 컨설팅·브랜드 콜라보 5년 경력의 큐레이터 &amp; 아트 디렉터 이력서" />
  <meta property="og:image"       content="https://lsm5735.github.io/rest01/images/og-image.png" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale"      content="ko_KR" />
  <meta property="og:site_name"   content="MIA LEE Portfolio" />

  <!-- ===== Twitter Card (선택) ===== -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="MIA LEE — Curator / Art Director" />
  <meta name="twitter:description" content="전시 기획·아트 컨설팅·브랜드 콜라보 5년 경력의 큐레이터 &amp; 아트 디렉터 이력서" />
  <meta name="twitter:image"       content="https://lsm5735.github.io/rest01/images/og-image.png" />

  <link rel="stylesheet" href="css/style.css?v=3" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ===== HERO / 프로필 ===== -->
  <header class="hero">
    <canvas id="hero-canvas"></canvas>
    <div class="hero-inner container">
      <div class="hero-photo">
        <img src="images/profile.jpg" alt="프로필 사진" id="profile-img" />
      </div>
      <div class="hero-info">
        <p class="hero-greeting">안녕하세요,</p>
        <h1 class="hero-name" id="name">[이름]</h1>
        <p class="hero-title" id="job-title">[직함 / 직종]</p>
        <p class="hero-bio" id="bio">
          한 줄 소개 또는 짧은 자기소개를 여기에 입력하세요.
        </p>
        <div class="hero-contacts">
          <a href="mailto:email@example.com" id="email-link" class="contact-btn">
            <span>📧</span> <span id="email-text">email@example.com</span>
          </a>
          <a href="tel:010-0000-0000" id="phone-link" class="contact-btn">
            <span>📱</span> <span id="phone-text">010-0000-0000</span>
          </a>
          <a href="https://github.com/lsm5735" target="_blank" class="contact-btn">
            <span>🐙</span> GitHub
          </a>
        </div>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- ===== 전문 분야 ===== -->
    <section class="section" id="skills-section">
      <h2 class="section-title">전문 분야</h2>
      <div class="skills-grid" id="skills-grid">
        <!-- JS로 채워질 예정 -->
      </div>
    </section>

    <!-- ===== 경력 ===== -->
    <section class="section" id="experience-section">
      <h2 class="section-title">경력</h2>
      <div class="timeline" id="experience-list">
        <!-- JS로 채워질 예정 -->
      </div>
    </section>

    <!-- ===== 학력 ===== -->
    <section class="section" id="education-section">
      <h2 class="section-title">학력</h2>
      <div class="timeline" id="education-list">
        <!-- JS로 채워질 예정 -->
      </div>
    </section>

    <!-- ===== 주요 전시·프로젝트 ===== -->
    <section class="section" id="projects-section">
      <h2 class="section-title">주요 전시·프로젝트</h2>
      <div class="cards-grid" id="projects-grid">
        <!-- JS로 채워질 예정 -->
      </div>
    </section>

    <!-- ===== 주요 이력 ===== -->
    <section class="section" id="certs-section">
      <h2 class="section-title">주요 전시 이력</h2>
      <ul class="cert-list" id="cert-list">
        <!-- JS로 채워질 예정 -->
      </ul>
    </section>

  </main>

  <footer class="footer">
    <p id="footer-text">© 2026 [이름]. All rights reserved.</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/hero-effects.js"></script>
  <script src="js/palette-switcher.js"></script>
</body>
</html>
